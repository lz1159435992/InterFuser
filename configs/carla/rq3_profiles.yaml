profiles:
  original:
    entry: experiments/carla/rq3_scripts_original/extract_rq3_tables.py
    notes: table extraction from output-structured CARLA json artifacts

  paper_carla_native:
    entry: experiments/carla/pipeline/run_interfuser_native.sh
    args_template:
      eval_type: town05
      native_enhance: high_fps

  paper_carla_lmdrive_native:
    entry: experiments/carla/pipeline/run_lmdrive_native.sh
    args_template:
      eval_type: langauto_tiny
      native_enhance: none

  paper_carla_lmdrive_sweep:
    entry: experiments/carla/pipeline/run_lmdrive_native_sweep_parallel.sh
    args_template:
      eval_types: langauto_tiny;langauto_short;langauto_long
      configs: none;high_fps;high_fps,no_noise;high_res;high_res,no_noise
      gpus: 0,1,2,3

  paper_carla_summary:
    entry: scripts/merge/extract_rq3_native_json_to_csv.py
    args_template:
      input_dir: results/raw/rq3/native_json
      output_csv: results/raw/rq3/carla_native_summary.csv
